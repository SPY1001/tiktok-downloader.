<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تيك توك بدون علامة مائية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #e11d48;
        }
        .ad-box {
            background: #2a2a2a;
            border: 2px dashed #444;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📥 تحميل تيك توك</h2>
        <p style="font-size: 13px; color: #aaa;">بدون علامة مائية وبأعلى جودة</p>

        <!-- مكان الإعلان العلوي -->
        <div class="ad-box">
            مكان الإعلان العلوي (Banner Ad)
        </div>

        <input type="text" id="tiktokUrl" placeholder="ألصق رابط التيك توك هنا...">
        <button onclick="downloadVideo()">تحميل المقطع</button>

        <!-- مكان الإعلان السفلي -->
        <div class="ad-box">
            مكان الإعلان السفلي (Banner Ad)
        </div>
    </div>

    <script>
        function downloadVideo() {
            const url = document.getElementById('tiktokUrl').value;
            if(!url) {
                alert('الرجاء وضع الرابط أولاً!');
                return;
            }
            alert('جاري معالجة الطلب وتحميل الفيديو...');
        }
    </script>

</body>
</html>
